name: iOS tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # If this runner label stops being available, bump to whatever the
    # current macOS label is in GitHub's runner-images releases.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | \
            python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['name'])
            sys.exit(0)
")
          echo "Selected simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # DriftUITests is excluded here — it's a known, documented Simulator
      # limitation (SecureField text entry can drop keystrokes under
      # XCUITest, unrelated to app correctness — see the header comment on
      # AuthFlowUITests.swift for the full writeup and how it was confirmed).
      # Run DriftUITests locally/manually against a real Simulator instead.
      - name: Run unit tests (DriftTests)
        run: |
          set -o pipefail
          xcodebuild \
            -project Drift.xcodeproj \
            -scheme Drift \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:DriftTests \
            CODE_SIGNING_ALLOWED=NO \
            test
