name: iOS tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # If this runner label stops being available, or "iPhone 16" isn't a
    # simulator it ships, bump both to whatever's current in GitHub's
    # runner-images releases (https://github.com/actions/runner-images).
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # GitHub-hosted macOS runners have no interactive login session, so
      # there's no keychain unlocked by default — every SecItemAdd /
      # SecItemCopyMatching call the Simulator app makes (i.e. all of
      # KeychainStore) fails silently as a result. Creating and unlocking
      # one, and adding it to the search list, is the standard fix.
      - name: Create and unlock a keychain for the simulator
        run: |
          security create-keychain -p "" build.keychain
          existing=()
          while IFS= read -r line; do existing+=("$line"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s build.keychain "${existing[@]}"
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

      - name: Boot simulator and wait until fully ready
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | awk -F '[()]' '{print $2}')
          echo "Booting simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # DriftUITests is excluded here — it's a known, documented Simulator
      # limitation (SecureField text entry can drop keystrokes under
      # XCUITest, unrelated to app correctness — see the header comment on
      # AuthFlowUITests.swift for the full writeup and how it was confirmed).
      # Run DriftUITests locally/manually against a real Simulator instead.
      # CODE_SIGN_IDENTITY=- ad-hoc signs the test app (no certificate/team
      # needed for Simulator) rather than leaving it fully unsigned
      # (CODE_SIGNING_ALLOWED=NO): an unsigned app has no
      # "application-identifier" entitlement, and the Simulator's Keychain
      # rejects SecItemAdd/SecItemCopyMatching from a process without one —
      # every KeychainStore test failed with exactly that silent-failure
      # signature (write appears to succeed, read-back is nil) until this
      # was added.
      - name: Run unit tests (DriftTests)
        run: |
          set -o pipefail
          xcodebuild \
            -project Drift.xcodeproj \
            -scheme Drift \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:DriftTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test
