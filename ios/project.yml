name: Drift
options:
  bundleIdPrefix: com.drift.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    SUPPORTS_MACCATALYST: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Drift:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Drift
    info:
      path: Generated/Drift-Info.plist
      properties:
        CFBundleDisplayName: Drift
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.ios
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          API_BASE_URL: "http://localhost:3099"
        Release:
          API_BASE_URL: "https://drift-hs0w.onrender.com"
    dependencies: []

  DriftTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DriftTests
    dependencies:
      - target: Drift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  DriftUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DriftUITests
    dependencies:
      - target: Drift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Drift

schemes:
  Drift:
    build:
      targets:
        Drift: all
        DriftTests: [test]
        DriftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DriftTests
        - DriftUITests
