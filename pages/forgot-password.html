<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drift — Reset your password</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1e1e1e;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text-2: #999999;
      --text-3: #555555;
      --accent: #e0e0e0;
      --bad: #888888;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }

    .brand p {
      margin: 0;
      color: var(--text-3);
      font-size: 13px;
    }

    p.help {
      color: var(--text-2);
      font-size: 13px;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #ffffff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      background: rgba(136, 136, 136, 0.1);
      border: 1px solid rgba(136, 136, 136, 0.3);
      color: var(--bad);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }

    .error.visible { display: block; }

    .success {
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .success.visible { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-2);
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Reset your password</h1>
      <p>We'll email you a link to set a new one</p>
    </div>

    <div id="error" class="error"></div>

    <div id="success" class="success">
      If an account exists for that email, a reset link has been sent. Check your inbox (and spam folder).
    </div>

    <form id="form" onsubmit="handleSubmit(event)">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />

      <button class="btn-primary" id="submit-btn" type="submit">Send reset link</button>
    </form>

    <a class="back-link" href="/pages/login.html">Back to sign in</a>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('error').classList.remove('visible');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      const email = document.getElementById('email').value.trim();

      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showError(data.error ?? 'Something went wrong');
          btn.disabled = false;
          return;
        }
        document.getElementById('form').style.display = 'none';
        document.getElementById('success').classList.add('visible');
      } catch {
        showError('Could not reach server');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
