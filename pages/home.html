<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>drift</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="wide">
    <div class="brand">
      <h1>drift</h1>
      <div class="menu-wrap" id="menu-wrap">
        <button class="menu-trigger" id="menu-trigger" onclick="toggleMenu()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </button>
        <div class="menu-dropdown" id="menu-dropdown">
          <a href="/pages/profile.html" class="menu-item">profile</a>
          <div class="menu-divider"></div>
          <button class="menu-item menu-item-danger" onclick="logout()">sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wide">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-actual" onclick="setMode('actual')">today</button>
      <button class="mode-btn" id="btn-whatif" onclick="setMode('whatif')">what If</button>
    </div>

    <div class="app-columns">
      <section class="col-log">
        <div class="card">
          <h2>Quick log</h2>
          <div class="quick-add" id="quick-add"></div>
        </div>

        <div class="card">
          <h2>Custom entry</h2>
          <div class="form-row">
            <select id="form-type"></select>
            <input id="form-amount" type="text" placeholder="Amount" />
            <input id="form-time" type="time" />
            <button class="btn-primary" id="form-add">Add</button>
          </div>
        </div>

        <div class="card">
          <h2>Today</h2>
          <ul class="events-list" id="events-list"></ul>
        </div>
      </section>

      <section class="col-forecast">
        <div class="card">
          <div class="forecast-hero">
            <div class="score" id="hero-score">—</div>
            <div class="label">Sleep forecast at bedtime</div>
            <div class="interpretation" id="hero-interpretation"></div>
            <div class="bedtime" id="hero-bedtime"></div>
          </div>
        </div>

        <div class="card">
          <h2>What's affecting you</h2>
          <div class="breakdown" id="breakdown"></div>
        </div>

        <div class="card">
          <h2>Decay timeline</h2>
          <div class="chart-wrap">
            <canvas id="decay-chart"></canvas>
          </div>
          <div class="chart-legend">
            Forecast score from now until 2 hours past bedtime. The dashed line marks your target bedtime.
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <a href="https://claude.ai/code/artifact/913903b6-56b1-405d-8837-8f724f5890e3" target="_blank" rel="noopener">the science behind your score</a>
  </footer>

  <div class="modal-overlay" id="edit-modal-overlay">
    <div class="modal">
      <h2>Edit event</h2>
      <div class="modal-field">
        <label for="edit-form-type">Type</label>
        <select id="edit-form-type"></select>
      </div>
      <div class="modal-field">
        <label for="edit-form-amount" id="edit-form-amount-label">Amount</label>
        <input id="edit-form-amount" type="text" placeholder="Amount" />
      </div>
      <div class="modal-field">
        <label for="edit-form-time">Time</label>
        <input id="edit-form-time" type="time" />
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" id="edit-form-cancel">Cancel</button>
        <button class="btn-primary" id="edit-form-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/types.js"></script>
  <script src="/js/time.js"></script>
  <script src="/js/decay.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/render-log.js"></script>
  <script src="/js/render-forecast.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/home-page.js"></script>
</body>
</html>
